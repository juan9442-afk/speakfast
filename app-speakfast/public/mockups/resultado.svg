<svg width="250" height="542" viewBox="0 0 250 542" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tu puntaje y tu chuleta de frases para el día real">
  <rect width="250" height="542" fill="#F3ECDA"/>
  <text x="20" y="36" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#665F52">FRONTEND DEVELOPER · ENTREVISTA 9</text>
  <text x="20" y="66" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#241F1A">Tu fluidez subió</text>
  <rect x="20" y="86" width="210" height="88" rx="16" fill="#FFFDF7" stroke="#B5502F" stroke-width="1.5"/>
  <text x="36" y="116" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#665F52">FLUIDEZ</text>
  <text x="36" y="156" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#241F1A">72<tspan font-size="16" fill="#665F52">/100</tspan></text>
  <text x="140" y="156" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1F7A5A">↑ 11 puntos</text>
  <rect x="20" y="188" width="210" height="52" rx="14" fill="#FFFDF7" stroke="#DCCFB0" stroke-width="1"/>
  <text x="34" y="210" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#241F1A">Muletillas: "ehm" x4 · "like" x2</text>
  <text x="34" y="228" font-family="Arial, sans-serif" font-size="11.5" fill="#1F7A5A" font-weight="700">Bajaste de 8 a 6</text>
  <rect x="20" y="252" width="210" height="52" rx="14" fill="#FFFDF7" stroke="#DCCFB0" stroke-width="1"/>
  <text x="34" y="274" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#241F1A">Pausa por traducción: 3.8s</text>
  <text x="34" y="292" font-family="Arial, sans-serif" font-size="11.5" fill="#665F52">Apunta a menos de 2s</text>
  <rect x="20" y="316" width="210" height="70" rx="14" fill="#FFFDF7" stroke="#DCCFB0" stroke-width="1"/>
  <text x="34" y="338" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#B5502F">TU CHULETA · 3 FRASES NUEVAS</text>
  <text x="34" y="358" font-family="Arial, sans-serif" font-size="11.5" fill="#241F1A">"Let me give you some context first…"</text>
  <text x="34" y="374" font-family="Arial, sans-serif" font-size="11.5" fill="#665F52" text-decoration="line-through">"I made a thing" →</text>
  <text x="128" y="374" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#241F1A">"I architected…"</text>
  <rect x="20" y="480" width="210" height="46" rx="13" fill="#1F7A5A"/>
  <text x="64" y="509" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFDF7">Abrir mi chuleta</text>
</svg>
